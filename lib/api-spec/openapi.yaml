openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Geenbank Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dossiers
  - name: documents
  - name: ai
  - name: reports
  - name: conditions
  - name: partners
  - name: submissions
  - name: dashboard
  - name: activity
  - name: integrations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user (or null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Set a new password (used on first login)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /dossiers/me:
    get:
      operationId: getMyDossier
      tags: [dossiers]
      summary: Get the authenticated prospect's dossier
      responses:
        "200":
          description: My dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }

  /dossiers/me/intake:
    put:
      operationId: updateMyIntake
      tags: [dossiers]
      summary: Update intake fields on the prospect's own dossier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeUpdate" }
      responses:
        "200":
          description: Updated dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }

  /dossiers/me/submit:
    post:
      operationId: submitMyDossier
      tags: [dossiers]
      summary: Submit dossier to Geenbank for loan officer review
      responses:
        "200":
          description: Submitted dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }
        "409":
          description: Submission blocked by the central dossier gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateBlockedError" }

  /dossiers:
    get:
      operationId: listDossiers
      tags: [dossiers]
      summary: List dossiers (loan officer / admin)
      parameters:
        - in: query
          name: bucket
          required: false
          schema:
            type: string
            enum: [all, new, in_review, ready, additional_info, approved, rejected]
      responses:
        "200":
          description: Dossiers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DossierListItem" }

  /dossiers/{dossierId}:
    get:
      operationId: getDossier
      tags: [dossiers]
      summary: Get a dossier by id (loan officer / admin)
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }

  /dossiers/{dossierId}/decision:
    post:
      operationId: makeDossierDecision
      tags: [dossiers]
      summary: Approve, reject, or request additional information
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
      responses:
        "200":
          description: Updated dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }

  /dossiers/me/documents:
    get:
      operationId: listMyDocuments
      tags: [documents]
      summary: List the prospect's own documents
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
    post:
      operationId: uploadMyDocument
      tags: [documents]
      summary: Upload a document to the prospect's own dossier (mock storage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpload" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }

  /documents/{documentId}/content:
    get:
      operationId: downloadDocument
      tags: [documents]
      summary: Download the binary contents of a document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Binary contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /dossiers/me/documents/{documentId}:
    delete:
      operationId: deleteMyDocument
      tags: [documents]
      summary: Delete a document from the prospect's own dossier
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }

  /dossiers/{dossierId}/documents:
    get:
      operationId: listDossierDocuments
      tags: [documents]
      summary: List documents on a specific dossier (loan officer / admin)
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }

  /dossiers/me/run-prevalidation:
    post:
      operationId: runMyPrevalidation
      tags: [ai]
      summary: Trigger pre-validation pipeline for the prospect's dossier
      responses:
        "200":
          description: New analysis run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIAnalysisRun" }

  /dossiers/me/run-analysis:
    post:
      operationId: runMyAnalysis
      tags: [ai]
      summary: Trigger full AI analysis for the prospect's dossier
      responses:
        "200":
          description: New analysis run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIAnalysisRun" }
        "409":
          description: Analysis blocked by the central dossier gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GateBlockedError" }

  /dossiers/{dossierId}/runs:
    get:
      operationId: listDossierRuns
      tags: [ai]
      summary: List analysis runs for a dossier
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AIAnalysisRun" }

  /dossiers/{dossierId}/latest-run:
    get:
      operationId: getLatestRun
      tags: [ai]
      summary: Get the latest analysis run for a dossier
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Latest run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIAnalysisRun" }

  /dossiers/me/report:
    get:
      operationId: getMyEntrepreneurReport
      tags: [reports]
      summary: Get entrepreneur-facing report from latest run
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntrepreneurReport" }

  /dossiers/{dossierId}/financier-report:
    get:
      operationId: getFinancierReport
      tags: [reports]
      summary: Get financier-facing report
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancierReport" }

  /dossiers/{dossierId}/dual-view-advice:
    get:
      operationId: getDualViewAdvice
      tags: [reports]
      summary: Get internal FinancingProductAdvisorDualView product advice (loan officers/admins only)
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Internal product advice extracted from the latest analysis run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DualViewAdvice" }
        "404":
          description: No analysis run yet, or no dual-view advice available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]

  /dossiers/{dossierId}/memorandum:
    post:
      operationId: generateMemorandum
      tags: [reports]
      summary: Generate credit memorandum
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemorandumRequest" }
      responses:
        "200":
          description: Memorandum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditMemorandum" }
    get:
      operationId: getMemorandum
      tags: [reports]
      summary: Get latest credit memorandum (if generated)
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Memorandum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditMemorandum" }

  /dossiers/{dossierId}/conditions:
    get:
      operationId: listConditions
      tags: [conditions]
      summary: List blocking and non-blocking conditions for a dossier
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conditions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Condition" }

  /dossiers/me/conditions:
    get:
      operationId: listMyConditions
      tags: [conditions]
      summary: List conditions for the prospect's own dossier
      responses:
        "200":
          description: Conditions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Condition" }

  /conditions/{conditionId}/respond:
    post:
      operationId: respondToCondition
      tags: [conditions]
      summary: Prospect submits a response to a requested item
      parameters:
        - in: path
          name: conditionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConditionResponseInput" }
      responses:
        "200":
          description: Updated condition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Condition" }

  /conditions/{conditionId}/resolve:
    post:
      operationId: resolveCondition
      tags: [conditions]
      summary: Loan officer / admin marks a submitted condition as resolved
      parameters:
        - in: path
          name: conditionId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConditionResolveInput" }
      responses:
        "200":
          description: Updated condition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Condition" }

  /dossiers/{dossierId}/request-additional-info:
    post:
      operationId: requestAdditionalInfo
      tags: [conditions]
      summary: |
        Loan officer turns one or more (internal) conditions into clear
        prospect-facing additional-information requests and sends the
        dossier into additional_info_requested.
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestAdditionalInfoInput" }
      responses:
        "200":
          description: The conditions that were requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  dossier: { $ref: "#/components/schemas/Dossier" }
                  conditions:
                    type: array
                    items: { $ref: "#/components/schemas/Condition" }
                required: [dossier, conditions]

  /dossiers/{dossierId}/return-to-review:
    post:
      operationId: returnDossierToReview
      tags: [dossiers]
      summary: Move dossier from additional_info_requested back to loan_officer_review
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated dossier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dossier" }

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List partner financiers
      responses:
        "200":
          description: Partners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PartnerFinancier" }
    post:
      operationId: createPartner
      tags: [partners]
      summary: Create a partner financier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerFinancier" }

  /partners/{partnerId}:
    put:
      operationId: updatePartner
      tags: [partners]
      summary: Update a partner financier
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerFinancier" }

  /dossiers/{dossierId}/submissions:
    get:
      operationId: listDossierSubmissions
      tags: [submissions]
      summary: List partner submissions for a dossier
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PartnerSubmission" }
    post:
      operationId: submitDossierToPartners
      tags: [submissions]
      summary: Send dossier package to selected partner financiers
      parameters:
        - in: path
          name: dossierId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerSubmissionRequest" }
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PartnerSubmission" }

  /dashboard/loan-officer:
    get:
      operationId: getLoanOfficerDashboard
      tags: [dashboard]
      summary: Aggregated metrics, quality buckets, and pipeline view
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanOfficerDashboard" }

  /dashboard/admin-metrics:
    get:
      operationId: getAdminMetrics
      tags: [dashboard]
      summary: Admin metrics (partners, submissions, conversion)
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMetrics" }

  /activity:
    get:
      operationId: listRecentActivity
      tags: [activity]
      summary: Most recent activity log entries (loan officer / admin)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityLogEntry" }

  /integrations/status:
    get:
      operationId: getIntegrationsStatus
      tags: [integrations]
      summary: Show whether Pipedrive, SendGrid, and AI skills are live or in mock mode
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationsStatus" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    Ok:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

    GateScores:
      type: object
      properties:
        completeness: { type: number }
        correctness: { type: number }
        confidence: { type: number }
        viability: { type: number }
      required: [completeness, correctness, confidence, viability]

    GateThresholds:
      type: object
      properties:
        completeness: { type: number }
        correctness: { type: number }
        confidence: { type: number }
        viability: { type: number }
      required: [completeness, correctness, confidence, viability]

    GateBlockedError:
      description: |
        Structured payload returned by endpoints guarded by the central
        dossier gate (`checkRunAnalysisGate`). Used by both
        `/dossiers/me/run-analysis` and `/dossiers/me/submit` so the
        frontend can render the same blocking UI for both flows.
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        reasons:
          type: array
          items: { type: string }
        actions:
          type: array
          items: { type: string }
        missingDocuments:
          type: array
          items: { type: string }
        invalidDocuments:
          type: array
          items: { type: string }
        pendingDocuments:
          type: array
          items: { type: string }
        blockingConditions: { type: integer }
        scores: { $ref: "#/components/schemas/GateScores" }
        thresholds: { $ref: "#/components/schemas/GateThresholds" }
      required:
        - error
        - message
        - reasons
        - actions
        - missingDocuments
        - invalidDocuments
        - pendingDocuments
        - blockingConditions
        - scores
        - thresholds

    Role:
      type: string
      enum: [prospect, loan_officer, admin]

    DossierStatus:
      type: string
      enum:
        - lead_created
        - account_invited
        - prospect_logged_in
        - intake_in_progress
        - documents_uploaded
        - pre_validation_running
        - blocked_missing_documents
        - blocked_invalid_documents
        - ready_for_ai_analysis
        - ai_analysis_running
        - entrepreneur_report_ready
        - submitted_to_geenbank
        - loan_officer_review
        - additional_info_requested
        - approved_for_partner_submission
        - rejected_by_loan_officer
        - memorandum_generated
        - submitted_to_partners
        - partner_response_received
        - closed

    LoginRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
      required: [currentPassword, newPassword]

    AuthUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        firstLoginCompleted: { type: boolean }
        displayName: { type: string, nullable: true }
      required: [id, email, role, firstLoginCompleted]

    AuthSession:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required: [user]

    ProspectProfile:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        companyName: { type: string }
        contactName: { type: string }
        kvkNumber: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        source: { type: string, nullable: true }
        pipedriveDealId: { type: string, nullable: true }
        createdAt: { type: string }
      required: [id, userId, companyName, contactName, createdAt]

    Dossier:
      type: object
      properties:
        id: { type: string }
        prospectId: { type: string }
        prospect: { $ref: "#/components/schemas/ProspectProfile" }
        status: { $ref: "#/components/schemas/DossierStatus" }
        currentStage: { type: string }
        financingPurpose: { type: string, nullable: true }
        requestedAmount: { type: number, nullable: true }
        financingTypePreference: { type: string, nullable: true }
        existingFinancing: { type: string, nullable: true }
        annualRevenue: { type: number, nullable: true }
        annualCost: { type: number, nullable: true }
        annualProfit: { type: number, nullable: true }
        companyDescription: { type: string, nullable: true }
        completenessScore: { type: number, nullable: true }
        correctnessScore: { type: number, nullable: true }
        viabilityScore: { type: number, nullable: true }
        confidenceScore: { type: number, nullable: true }
        aiVerdict: { type: string, nullable: true }
        loanOfficerDecision: { type: string, nullable: true }
        loanOfficerNotes: { type: string, nullable: true }
        submittedAt: { type: string, nullable: true }
        createdAt: { type: string }
        updatedAt: { type: string }
        intakeCompletionPercent: { type: number }
        documentsCount: { type: integer }
        blockingConditionsCount: { type: integer }
      required:
        - id
        - prospectId
        - status
        - currentStage
        - createdAt
        - updatedAt
        - intakeCompletionPercent
        - documentsCount
        - blockingConditionsCount

    DossierListItem:
      type: object
      properties:
        id: { type: string }
        companyName: { type: string }
        contactName: { type: string }
        status: { $ref: "#/components/schemas/DossierStatus" }
        currentStage: { type: string }
        requestedAmount: { type: number, nullable: true }
        financingPurpose: { type: string, nullable: true }
        completenessScore: { type: number, nullable: true }
        correctnessScore: { type: number, nullable: true }
        viabilityScore: { type: number, nullable: true }
        confidenceScore: { type: number, nullable: true }
        aiVerdict: { type: string, nullable: true }
        submittedAt: { type: string, nullable: true }
        updatedAt: { type: string }
        bucket: { type: string }
      required:
        - id
        - companyName
        - contactName
        - status
        - currentStage
        - updatedAt
        - bucket

    IntakeUpdate:
      type: object
      properties:
        companyName: { type: string, nullable: true }
        contactName: { type: string, nullable: true }
        kvkNumber: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        financingPurpose: { type: string, nullable: true }
        requestedAmount: { type: number, nullable: true }
        financingTypePreference: { type: string, nullable: true }
        existingFinancing: { type: string, nullable: true }
        annualRevenue: { type: number, nullable: true }
        annualCost: { type: number, nullable: true }
        annualProfit: { type: number, nullable: true }
        companyDescription: { type: string, nullable: true }

    Document:
      type: object
      properties:
        id: { type: string }
        dossierId: { type: string }
        uploadedBy: { type: string }
        documentType: { type: string }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        storagePath: { type: string }
        uploadStatus: { type: string }
