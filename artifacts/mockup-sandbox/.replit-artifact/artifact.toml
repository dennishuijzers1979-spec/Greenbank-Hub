kind = "design"
previewPath = "/__mockup"
title = "Canvas"
version = "1.0.0"
id = "XegfDyZt7HqfW2Bb8Ghoy"

[[services]]
localPort = 8081
name = "Component Preview Server"
paths = ["/__mockup"]

[services.env]
PORT = "8081"
BASE_PATH = "/__mockup"

[services.development]
run = "pnpm --filter @workspace/mockup-sandbox run dev"

# The mockup-sandbox is a dev-only Canvas / design tool. It must not be
# deployed to production. The production block is intentionally a no-op
# (no build, no run) so Replit's deploy sweep ignores this artifact.
[services.production]
